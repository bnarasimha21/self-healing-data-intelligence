# Postgres for tests/test_postgres_end_to_end.py. Throwaway credentials, local only.
#
#   docker compose -p shdi-test -f docker-compose.test.yml up -d --wait
#   export SHDI_PG_DSN=postgresql://shdi_reader:reader@localhost:55433/shdi
#   export SHDI_PG_SINK_DSN=postgresql://shdi_writer:writer@localhost:55433/shdi
#   pytest -m postgres
#   docker compose -p shdi-test -f docker-compose.test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shdi
      POSTGRES_USER: shdi_admin
      POSTGRES_PASSWORD: admin
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./tests/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shdi_admin -d shdi"]
      interval: 1s
      timeout: 3s
      retries: 30
