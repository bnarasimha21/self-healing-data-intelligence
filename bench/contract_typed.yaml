apiVersion: shdi/v1
name: bench_sales_typed
version: "1"
description: Contract for the typed benchmark table (bench/corrupt.py, scenario typed).
primary_key: [id]
max_null_ratio: 0.3
columns:
  id:
    type: integer
    nullable: false
  day:
    type: date
    nullable: true
    min: "1970-01-01"
    max: today
  amount:
    type: number
    nullable: false
    min: 0
    max: 10000
    measure: true
    unit_factors: [1000]
    checks:
      # A negative amount cannot be repaired by clamping it to 0 (that invents
      # a value), so this contract quarantines it for a person to look at.
      min: {on_violation: quarantine}
  ts:
    type: timestamp
    nullable: false
  region:
    type: string
    nullable: false
    default: Unknown
    accepted_values: [North, South, East, West, Unknown]
