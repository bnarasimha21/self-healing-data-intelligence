<svg viewBox="0 0 1000 946" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Self-Healing Data Intelligence run flow</title><desc>One run in seven steps: start, load and fingerprint, validate, propose, approve, apply, re-validate and summarize. Six of the steps have an exit where the run or a single change stops. Only the apply step writes, and every decision and change is recorded.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker></defs><rect x="0" y="0" width="1000" height="946" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">Self-Healing Data Intelligence: One Run, Every Exit</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Each step passes the data on or stops. When a value cannot be trusted, the row is held for a person.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">ONE RUN THROUGH THE PIPELINE</text><text x="610" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">WHERE THE RUN OR A CHANGE STOPS</text><rect x="30" y="108" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="132" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="136" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">1</text><text x="76" y="136" font-size="14" fill="#2C2C2A" font-weight="600">Run starts</text><text x="76" y="154" font-size="11" fill="#5F5E5A">shdi run, or propose_repairs over MCP;</text><text x="76" y="169" font-size="11" fill="#5F5E5A">the contract is loaded and checked before a run exists</text><path d="M530,143 L606,143" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="112" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="134" font-size="12.5" fill="#A32D2D" font-weight="600">Contract cannot work</text><text x="624" y="151" font-size="11" fill="#A32D2D">unknown key, impossible rule or bad default:</text><text x="624" y="165" font-size="11" fill="#A32D2D">rejected at load, exit code 2</text><path d="M280,178 L280,201" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="204" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="228" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="232" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">2</text><text x="76" y="232" font-size="14" fill="#2C2C2A" font-weight="600">Load and fingerprint the source</text><text x="76" y="250" font-size="11" fill="#5F5E5A">read-only connection; sha256 over the column types</text><text x="76" y="265" font-size="11" fill="#5F5E5A">and the text of every cell. State keeps the hash, not the rows</text><path d="M530,239 L606,239" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="208" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="230" font-size="12.5" fill="#A32D2D" font-weight="600">Source cannot be read safely</text><text x="624" y="247" font-size="11" fill="#A32D2D">repeated header, extra fields or not UTF-8:</text><text x="624" y="261" font-size="11" fill="#A32D2D">refused, not read with shifted columns</text><path d="M280,274 L280,297" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="300" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="324" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="328" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">3</text><text x="76" y="328" font-size="14" fill="#0F6E56" font-weight="600">Validate against the contract</text><text x="76" y="346" font-size="11" fill="#0F6E56">every declared check, by row; outliers on measure columns</text><text x="76" y="361" font-size="11" fill="#0F6E56">are reported for review and never changed</text><path d="M280,370 L280,393" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="396" width="500" height="70" rx="9" fill="#E1F5EE" stroke="#1D9E75"/><circle cx="54" cy="420" r="12" fill="#FFFFFF" stroke="#1D9E75"/><text x="54" y="424" font-size="12" fill="#0F6E56" font-weight="600" text-anchor="middle">4</text><text x="76" y="424" font-size="14" fill="#0F6E56" font-weight="600">Propose repairs</text><text x="76" y="442" font-size="11" fill="#0F6E56">one proposal per cell fix or row removal, with old value,</text><text x="76" y="457" font-size="11" fill="#0F6E56">new value and reason. Nothing is changed yet</text><path d="M530,431 L606,431" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="400" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="422" font-size="12.5" fill="#A32D2D" font-weight="600">Value cannot be recovered</text><text x="624" y="439" font-size="11" fill="#A32D2D">wrong type or conflicting key: the row is</text><text x="624" y="453" font-size="11" fill="#A32D2D">proposed for quarantine, not guessed</text><path d="M280,466 L280,489" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="492" width="500" height="70" rx="9" fill="#FAEEDA" stroke="#BA7517"/><circle cx="54" cy="516" r="12" fill="#FFFFFF" stroke="#BA7517"/><text x="54" y="520" font-size="12" fill="#854F0B" font-weight="600" text-anchor="middle">5</text><text x="76" y="520" font-size="14" fill="#854F0B" font-weight="600">Approve: the run pauses for a person</text><text x="76" y="538" font-size="11" fill="#854F0B">hours or days, resumed from any process; only casts</text><text x="76" y="553" font-size="11" fill="#854F0B">that change no text are approved by policy</text><path d="M530,527 L606,527" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="496" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="518" font-size="12.5" fill="#A32D2D" font-weight="600">Proposal rejected</text><text x="624" y="535" font-size="11" fill="#A32D2D">that cell stays as the source has it;</text><text x="624" y="549" font-size="11" fill="#A32D2D">reject all gives byte-identical output</text><path d="M280,562 L280,585" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="588" width="500" height="70" rx="9" fill="#EEEDFE" stroke="#7F77DD"/><circle cx="54" cy="612" r="12" fill="#FFFFFF" stroke="#7F77DD"/><text x="54" y="616" font-size="12" fill="#3C3489" font-weight="600" text-anchor="middle">6</text><text x="76" y="616" font-size="14" fill="#3C3489" font-weight="600">Apply approved changes</text><text x="76" y="634" font-size="11" fill="#3C3489">re-reads the source, then writes staging and quarantine</text><text x="76" y="649" font-size="11" fill="#3C3489">in one transaction. The source is never written</text><path d="M530,623 L606,623" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="592" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="614" font-size="12.5" fill="#A32D2D" font-weight="600">Source changed, or a cell would differ</text><text x="624" y="631" font-size="11" fill="#A32D2D">stale_source: nothing of the run is kept;</text><text x="624" y="645" font-size="11" fill="#A32D2D">a value unlike its proposal refuses the write</text><path d="M280,658 L280,681" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="684" width="500" height="70" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><circle cx="54" cy="708" r="12" fill="#FFFFFF" stroke="#D3D1C7"/><text x="54" y="712" font-size="12" fill="#2C2C2A" font-weight="600" text-anchor="middle">7</text><text x="76" y="712" font-size="14" fill="#2C2C2A" font-weight="600">Re-validate and summarize</text><text x="76" y="730" font-size="11" fill="#5F5E5A">every check is run again on the output;</text><text x="76" y="745" font-size="11" fill="#5F5E5A">before and after counts are reported</text><path d="M530,719 L606,719" fill="none" stroke="#E24B4A" stroke-width="2" marker-end="url(#ar)"/><rect x="610" y="688" width="360" height="62" rx="9" fill="#FCEBEB" stroke="#E24B4A"/><text x="624" y="710" font-size="12.5" fill="#A32D2D" font-weight="600">Checks still failing</text><text x="624" y="727" font-size="11" fill="#A32D2D">status failed_checks, exit code 1;</text><text x="624" y="741" font-size="11" fill="#A32D2D">staging is written, so check the status</text><text x="30" y="784" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">EVERY DECISION AND EVERY CHANGE LEAVES A RECORD</text><rect x="30" y="796" width="940" height="50" rx="9" fill="#F1EFE8" stroke="#D3D1C7"/><text x="500" y="818" font-size="12.5" fill="#2C2C2A" font-weight="600" text-anchor="middle">Append-only audit log, a checkpoint after each step and one OpenTelemetry span per step</text><text x="500" y="835" font-size="11" fill="#5F5E5A" text-anchor="middle">each audit record carries the row keys, old and new values, the reviewer and the source fingerprint</text><text x="30" y="876" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="888" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="54" y="900" font-size="11.5" fill="#5F5E5A">Contract decides here</text><rect x="212.1" y="888" width="16" height="16" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/><text x="236.1" y="900" font-size="11.5" fill="#5F5E5A">A person decides here</text><rect x="394.2" y="888" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="418.2" y="900" font-size="11.5" fill="#5F5E5A">The only step that writes</text><rect x="600.7" y="888" width="16" height="16" rx="3" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="624.7" y="900" font-size="11.5" fill="#5F5E5A">Stopped or held back</text><text x="30" y="926" font-size="10.5" fill="#5F5E5A">A full run takes 7.6 s on 10,150 rows and 76.7 s on 101,500 rows, text columns, one process. The smaller table yields 1,050 proposals that need a decision. Times exclude the pause.</text></svg>
