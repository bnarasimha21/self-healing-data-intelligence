<svg viewBox="0 0 1000 916" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Self-Healing Data Intelligence deployment today</title><desc>Two front doors onto the same run, both on one host. In CLI mode a reviewer drives one shdi process that reads a contract, a data file, checkpoints and an audit log from local disk, and can reach Postgres and an optional model provider outside the machine. In MCP mode an agent talks to one shdi-mcp process over stdio; read tools and propose_repairs write nothing and only decide writes, to staging and quarantine. Trust boundaries are drawn as dashed lines.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F77DD"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D9E75"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E24B4A"/></marker></defs><rect x="0" y="0" width="1000" height="916" fill="#FFFFFF"/><text x="30" y="36" font-size="23" fill="#2C2C2A" font-weight="600">Self-Healing Data Intelligence: Where It Runs Today</text><text x="30" y="57" font-size="13.5" fill="#5F5E5A">Two front doors onto the same run, both on one host. Dashed lines are trust boundaries.</text><text x="30" y="92" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">A. CLI MODE: ONE OPERATOR'S MACHINE</text><rect x="30" y="104" width="680" height="342" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="46" y="126" font-size="11.5" fill="#2C2C2A" font-weight="600">Trust boundary: one host and its disk</text><text x="46" y="141" font-size="10.5" fill="#5F5E5A">trusted here: the operator, the contract file and the reviewer's decisions</text><rect x="46" y="168" width="170" height="84" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="58" y="189" font-size="13" fill="#2C2C2A" font-weight="600">Reviewer</text><text x="58" y="206.0" font-size="10.5" fill="#5F5E5A">shdi CLI: run, review,</text><text x="58" y="220.5" font-size="10.5" fill="#5F5E5A">approve, reject, audit;</text><text x="58" y="235.0" font-size="10.5" fill="#5F5E5A">named by the OS user</text><rect x="286" y="150" width="214" height="120" rx="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="298" y="171" font-size="13" fill="#3C3489" font-weight="600">shdi process</text><text x="298" y="188.0" font-size="10.5" fill="#3C3489">one LangGraph run, seven steps</text><text x="298" y="202.5" font-size="10.5" fill="#3C3489">whole table held in memory</text><text x="298" y="217.0" font-size="10.5" fill="#3C3489">pauses at approve, resumable</text><text x="298" y="231.5" font-size="10.5" fill="#3C3489">from any process on this host</text><text x="298" y="246.0" font-size="10.5" fill="#3C3489">only the apply step writes</text><path d="M216,210 L283,210" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="249.5" y="202" font-size="10.5" fill="#5F5E5A" text-anchor="middle">start, decide</text><rect x="46" y="330" width="150" height="60" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="58" y="351" font-size="12" fill="#0F6E56" font-weight="600">Contract YAML</text><text x="58" y="368.0" font-size="10.5" fill="#0F6E56">rules and policies,</text><text x="58" y="382.5" font-size="10.5" fill="#0F6E56">read at run start</text><rect x="212" y="330" width="150" height="60" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="224" y="351" font-size="12" fill="#2C2C2A" font-weight="600">CSV or DuckDB file</text><text x="224" y="368.0" font-size="10.5" fill="#5F5E5A">source is read-only;</text><text x="224" y="382.5" font-size="10.5" fill="#5F5E5A">sinks are separate</text><rect x="378" y="330" width="150" height="60" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="390" y="351" font-size="12" fill="#2C2C2A" font-weight="600">Checkpoints, locks</text><text x="390" y="368.0" font-size="10.5" fill="#5F5E5A">SQLite and flock;</text><text x="390" y="382.5" font-size="10.5" fill="#5F5E5A">proposals, no rows</text><rect x="544" y="330" width="150" height="60" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="556" y="351" font-size="12" fill="#2C2C2A" font-weight="600">Audit log</text><text x="556" y="368.0" font-size="10.5" fill="#5F5E5A">append-only SQLite,</text><text x="556" y="382.5" font-size="10.5" fill="#5F5E5A">one record per change</text><path d="M393,270 L393,312 M121,312 L619,312" fill="none" stroke="#888780" stroke-width="2"/><path d="M121,312 L121,327" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M287,312 L287,327" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M453,312 L453,327" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><path d="M619,312 L619,327" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="401" y="300" font-size="10.5" fill="#5F5E5A">local files</text><text x="46" y="416" font-size="10.5" fill="#A32D2D">Crossing in, always treated as data: every cell of the source. Cells reach a model only when SHDI_LLM=explain is set.</text><text x="46" y="432" font-size="10.5" fill="#A32D2D">Not covered: anyone who can write this folder can change the contract or delete the audit log file.</text><rect x="750" y="104" width="220" height="342" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="766" y="126" font-size="11.5" fill="#2C2C2A" font-weight="600">Outside the machine</text><text x="766" y="141" font-size="10.5" fill="#5F5E5A">credentials come from env vars</text><rect x="766" y="152" width="188" height="66" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="778" y="173" font-size="13" fill="#2C2C2A" font-weight="600">Postgres</text><text x="778" y="190.0" font-size="10.5" fill="#5F5E5A">read as a SELECT-only role;</text><text x="778" y="204.5" font-size="10.5" fill="#5F5E5A">sinks written as a second role</text><rect x="766" y="226" width="188" height="66" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="778" y="247" font-size="13" fill="#A32D2D" font-weight="600">Model provider</text><text x="778" y="264.0" font-size="10.5" fill="#A32D2D">optional, off by default; sees</text><text x="778" y="278.5" font-size="10.5" fill="#A32D2D">cell values in explain mode</text><path d="M500,185 L763,185" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/><text x="631" y="177" font-size="10.5" fill="#5F5E5A" text-anchor="middle">SQL; writes sink tables only</text><path d="M500,259 L763,259" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="631" y="251" font-size="10.5" fill="#5F5E5A" text-anchor="middle">HTTPS; text back only</text><text x="766" y="322" font-size="10.5" fill="#5F5E5A">A URI that carries credentials</text><text x="766" y="336" font-size="10.5" fill="#5F5E5A">is rejected. Table names must</text><text x="766" y="350" font-size="10.5" fill="#5F5E5A">be plain identifiers.</text><text x="766" y="380" font-size="10.5" fill="#5F5E5A">OpenTelemetry export is optional:</text><text x="766" y="394" font-size="10.5" fill="#5F5E5A">one span per step, off by default.</text><text x="30" y="490" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">B. MCP MODE: ONE AGENT'S MACHINE</text><rect x="330" y="502" width="340" height="306" rx="12" fill="#FFFFFF" stroke="#888780" stroke-width="1.5" stroke-dasharray="7 5"/><text x="346" y="524" font-size="11.5" fill="#2C2C2A" font-weight="600">Trust boundary: one shdi-mcp process</text><text x="346" y="539" font-size="10.5" fill="#5F5E5A">started over stdio; its env is set by the operator</text><rect x="346" y="552" width="308" height="56" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="358" y="573" font-size="13" fill="#2C2C2A" font-weight="600">Read tools</text><text x="358" y="590.0" font-size="10.5" fill="#5F5E5A">profile_source, validate, list_pending, get_audit</text><rect x="346" y="616" width="308" height="56" rx="9" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/><text x="358" y="637" font-size="13" fill="#2C2C2A" font-weight="600">propose_repairs</text><text x="358" y="654.0" font-size="10.5" fill="#5F5E5A">starts a run that always pauses; writes nothing</text><rect x="346" y="680" width="308" height="56" rx="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="358" y="701" font-size="13" fill="#3C3489" font-weight="600">decide</text><text x="358" y="718.0" font-size="10.5" fill="#3C3489">the only tool that writes, once every change is decided</text><rect x="346" y="744" width="308" height="52" rx="9" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="358" y="765" font-size="13" fill="#0F6E56" font-weight="600">Source allowlist and contract folder</text><text x="358" y="782.0" font-size="10.5" fill="#0F6E56">nothing allowed by default; contracts by name only</text><rect x="30" y="552" width="186" height="56" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="42" y="573" font-size="13" fill="#A32D2D" font-weight="600">MCP client</text><text x="42" y="590.0" font-size="10.5" fill="#A32D2D">an agent acting on text it read</text><path d="M216,580 L343,580" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="278" y="572" font-size="10.5" fill="#5F5E5A" text-anchor="middle">stdio, 6 tools</text><text x="30" y="640" font-size="10.5" fill="#A32D2D">Nothing forces a person into the</text><text x="30" y="654" font-size="10.5" fill="#A32D2D">loop: an agent can call decide</text><text x="30" y="668" font-size="10.5" fill="#A32D2D">with every id. The reviewer</text><text x="30" y="682" font-size="10.5" fill="#A32D2D">name is a free string.</text><rect x="776" y="552" width="194" height="56" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="788" y="573" font-size="13" fill="#2C2C2A" font-weight="600">Allowed sources</text><text x="788" y="590.0" font-size="10.5" fill="#5F5E5A">read-only, on the allowlist</text><path d="M654,580 L773,580" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="712" y="572" font-size="10.5" fill="#5F5E5A" text-anchor="middle">read</text><rect x="776" y="616" width="194" height="56" rx="9" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/><text x="788" y="637" font-size="13" fill="#2C2C2A" font-weight="600">Run state on disk</text><text x="788" y="654.0" font-size="10.5" fill="#5F5E5A">the same files the CLI uses</text><path d="M654,644 L773,644" fill="none" stroke="#888780" stroke-width="2" marker-end="url(#a)"/><text x="712" y="636" font-size="10.5" fill="#5F5E5A" text-anchor="middle">checkpoint</text><rect x="776" y="680" width="194" height="56" rx="9" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="788" y="701" font-size="13" fill="#3C3489" font-weight="600">Staging and quarantine</text><text x="788" y="718.0" font-size="10.5" fill="#3C3489">the only tables written</text><path d="M654,708 L773,708" fill="none" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/><text x="712" y="700" font-size="10.5" fill="#5F5E5A" text-anchor="middle">write</text><text x="776" y="760" font-size="10.5" fill="#5F5E5A">Paths are resolved before matching;</text><text x="776" y="774" font-size="10.5" fill="#5F5E5A">connection strings never come</text><text x="776" y="788" font-size="10.5" fill="#5F5E5A">from tool arguments.</text><text x="30" y="842" font-size="11.5" fill="#5F5E5A" font-weight="600" letter-spacing="0.5">LEGEND</text><rect x="30" y="854" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#888780" stroke-dasharray="4 3"/><text x="54" y="866" font-size="11.5" fill="#5F5E5A">Trust boundary</text><rect x="169.39999999999998" y="854" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/><text x="193.39999999999998" y="866" font-size="11.5" fill="#5F5E5A">Writes data</text><rect x="290.5" y="854" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/><text x="314.5" y="866" font-size="11.5" fill="#5F5E5A">Contract and allowlist</text><rect x="478.7" y="854" width="16" height="16" rx="3" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/><text x="502.7" y="866" font-size="11.5" fill="#5F5E5A">Untrusted</text><text x="30" y="892" font-size="10.5" fill="#5F5E5A">What this shows: both doors run the same code on one host, with state in local SQLite files and file locks. No shared store, no scheduler, no login.</text><text x="30" y="906" font-size="10.5" fill="#5F5E5A">The design record lists what changes to run it on larger tables and for more than one team.</text></svg>
